        widget: string
      hint: 'Headline lines. Put a word between *stars* to make it italic, for example: *scroll* past.'
    - label: Rating pill
      name: rating
      widget: object
      fields:
      - label: Score
        name: score
        widget: string
      - label: Text
        name: label
        widget: string
    - label: Intro paragraph
